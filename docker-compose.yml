# JARVIS MARK 7 in Docker.
#
#   node scripts/setup.mjs                      # once: creates .env and an access token
#   docker compose up --build                   # JARVIS only (use a cloud provider or host Ollama)
#   docker compose --profile ollama up --build  # JARVIS + a local Ollama model server
#
# Then open http://localhost:3000 and enter your JARVIS_ACCESS_TOKEN.

services:
  jarvis:
    build: .
    image: jarvis-mark-7
    restart: unless-stopped
    env_file: .env
    environment:
      # .env is written for running on the host (localhost). Inside a container, localhost is
      # the container itself, so point the local model at the right place here instead.
      #   default:                       the bundled "ollama" service below (--profile ollama)
      #   Ollama running on your host:   DOCKER_LLM_BASE_URL=http://host.docker.internal:11434/v1
      LOCAL_LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://ollama:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Linux reach host services too
    ports:
      # Loopback only. The login is a token over plain HTTP, so do not publish this to your
      # LAN or the internet without HTTPS in front. To expose it deliberately: JARVIS_BIND=0.0.0.0
      - "${JARVIS_BIND:-127.0.0.1}:${JARVIS_PORT:-3000}:3000"
    volumes:
      - jarvis-data:/app/data   # memory, tasks, usage. Survives rebuilds.

  # --- Optional: local models, fully offline ---------------------------------------------
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    # NVIDIA GPU (needs the NVIDIA Container Toolkit). Uncomment to use it:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: downloads LOCAL_LLM_MODEL (default llama3.2) into the ollama volume, then exits.
  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.2}   # read from .env; no secrets are passed to this container
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$LOCAL_LLM_MODEL\""]
    restart: "no"

volumes:
  jarvis-data:
  ollama-models:
